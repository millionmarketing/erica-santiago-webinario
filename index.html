<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>WhatsApp que Vende 20/10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: régua do dia — coluna de horários à esquerda, mensagens prontas pra copiar à direita */
:root{color-scheme:light;
  --bg:#fbf8fb; --surface:#ffffff; --ink:#24172a; --muted:#6d5f73; --line:#eadfec;
  --plum:#7a2e8e; --plum-soft:#f3e6f6; --bubble:#f6f1f7; --live:#d4334a; --ok:#2f7d5b; --ok-soft:#e3f2ea;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17111a; --surface:#211826; --ink:#f2eaf4; --muted:#ad9fb3; --line:#3a2c40;
  --plum:#d394e4; --plum-soft:#352240; --bubble:#2a1f30; --live:#ff6b7f; --ok:#6fcf9f; --ok-soft:#1f3329; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17111a; --surface:#211826; --ink:#f2eaf4; --muted:#ad9fb3; --line:#3a2c40;
  --plum:#d394e4; --plum-soft:#352240; --bubble:#2a1f30; --live:#ff6b7f; --ok:#6fcf9f; --ok-soft:#1f3329; color-scheme:dark}

body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}

header{display:grid;gap:14px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--plum)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1.05;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}

.panel{display:grid;grid-template-columns:auto 1fr;gap:16px 24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.count{display:grid;gap:2px}
.count .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.count .num{font-family:var(--f-mono);font-size:28px;font-variant-numeric:tabular-nums;color:var(--plum)}
.count.live .num{color:var(--live)}
.linkbox{display:grid;gap:6px;min-width:0}
.linkbox label{font-size:13px;font-weight:600}
.linkbox input{font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.linkbox input:focus{outline:2px solid var(--plum);outline-offset:1px}
.linkbox small{color:var(--muted)}
@media (max-width:560px){.panel{grid-template-columns:1fr}}

h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0}
.section{display:grid;gap:14px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.section-head span{color:var(--muted);font-size:13px}

.msg{display:grid;grid-template-columns:76px 1fr;gap:16px}
.time{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums;padding-top:14px;color:var(--muted);text-align:right}
.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:12px}
.msg.next .card{border-color:var(--plum);box-shadow:0 0 0 3px var(--plum-soft)}
.msg.next .time{color:var(--plum)}
.msg.sent .card{opacity:.62}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.name{font-weight:600}
.pill{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--plum-soft);color:var(--plum)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:transparent;color:var(--live);border:1px solid var(--live)}
.bubble{background:var(--bubble);border-radius:4px 12px 12px 12px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.bubble .ph{background:var(--live);color:#fff;border-radius:4px;padding:0 4px}
.bubble .lk{color:var(--plum);text-decoration:underline}
.art{margin:0;display:grid;gap:6px;max-width:320px}
.art img{width:100%;height:auto;border-radius:10px;display:block}
.art figcaption{font-size:12.5px;color:var(--muted)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:14px;font-weight:600;cursor:pointer;border-radius:10px;padding:8px 14px;border:1px solid var(--plum);background:var(--plum);color:var(--surface)}
button:hover{filter:brightness(1.08)}
button:focus-visible,.chk input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--ok);width:16px;height:16px}
.copied{font-size:13px;color:var(--ok)}

@media (max-width:480px){.msg{grid-template-columns:1fr;gap:4px}.time{text-align:left;padding-top:0}}
@media (prefers-reduced-motion:no-preference){.card{transition:opacity .2s,box-shadow .2s}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Erica Santiago · Lançamento</div>
    <h1>Workshop WhatsApp que Vende</h1>
    <div class="meta"><span>Terça, <b>20/10</b></span><span>Ao vivo às <b>20h</b></span><span>Grupo oficial · 12 envios hoje</span></div>
  </header>

  <div class="panel">
    <div class="count" id="count"><span class="lbl" id="countLbl">Até a live</span><span class="num" id="countNum">--:--:--</span></div>
    <div class="linkbox">
      <label for="meet">Link da aula no Meet</label>
      <input id="meet" type="url" placeholder="https://meet.google.com/..." autocomplete="off">
      <small>Cola aqui uma vez e ele entra sozinho nas mensagens das 19h30 e das 20h.</small>
    </div>
  </div>

  <section class="section">
    <div class="section-head"><h2>Sequência de hoje</h2><span id="progress"></span></div>
    <div id="today" class="section"></div>
  </section>
</div>

<script>
const PH = "[LINK DA AULA NO MEET]";
const today = [
 {id:"a1", at:"08:00", name:"Boas-vindas", text:`Seja muito bem-vindos ao grupo oficial do nosso *Workshop WhatsApp que Vende*.

É por aqui que eu vou enviar todas as informações, lembretes e o link da aula até o nosso encontro ao vivo.

🕗 *Horário:* 20h
💻 *100% online e gratuito*

Nesse workshop eu vou te mostrar como transformar conversas no WhatsApp em mais procedimentos vendidos, todos os dias.

Você vai descobrir:

✅ *Segredo #1*

Por que clientes interessadas perguntam o preço e desaparecem, e o erro na conversa que faz você perder vendas sem perceber.

✅ *Segredo #2*

Como conduzir a conversa do primeiro "oi" até o agendamento, sabendo o que falar e qual deve ser o próximo passo.

✅ *Segredo #3*

Como vender seu procedimento sem recorrer a desconto, pressão ou ficar mandando mensagem atrás da cliente.

Ativa as notificações desse grupo pra não perder nada. 🔔

Nos vemos hoje, às 20h, ao vivo!
_Erica Santiago_ 💜`},
 {id:"a2", at:"10:00", name:"Hoje é o grande dia", text:`⏳ *Hoje é o grande dia.*

Meu objetivo é que você termine esse workshop olhando pras suas conversas de um jeito completamente diferente, e *sabendo exatamente o que fazer pra vender mais procedimentos*.

Estou aqui preparando tudo com muito carinho. 💜

Te vejo hoje às 20h!

_Erica Santiago_`},
 {id:"t1", at:"12:00", name:"É hoje", text:`🚨 *É hoje!*

Hoje, às 20h, acontece o nosso *Workshop WhatsApp que Vende*.

Você vai descobrir:

✅ Por que a cliente pergunta o preço e some, e o erro que está por trás disso

✅ O caminho exato da conversa, do primeiro "oi" até o agendamento

✅ Como vender seus procedimentos sem dar desconto, sem pressão e sem correr atrás

O link da aula vai ser enviado aqui no grupo antes de começar.

Vai ser incrível.

Já se organiza!

_Erica Santiago_ 💜`},
 {id:"t2", at:"14:00", name:"Insight", text:`*Pensa nas conversas que você teve essa semana.* 💭

Quantas clientes perguntaram o valor…
Quantas disseram _"vou pensar"_…
E quantas realmente agendaram?

A maioria das profissionais acha que a diferença entre esses números é o preço.

*Não é.*

Duas profissionais com o mesmo procedimento, na mesma cidade, cobrando o mesmo valor, podem ter resultados completamente diferentes usando estratégias dentro do WhatsApp.

Hoje, às 20h, eu vou te mostrar o que separa uma da outra.

_Erica Santiago_ 💜`},
 {id:"q1", at:"16:00", name:"Questionário", text:`Responde 👇🏻
🔘 Ela pergunta o preço e some
🔘 Ela diz que vai pensar e desaparece
🔘 Eu acabo dando desconto para tentar fechar
🔘 Consigo conduzir até o agendamento 💰`},
 {id:"t3", at:"18:00", name:"Faltam 2 horas", text:`⏰ *Faltam apenas 2 horas.*

Estou preparando tudo para nosso encontro logo mais.

O link vai ser enviado aqui no grupo.

Fica atenta! 💜

_Erica Santiago_`},
 {id:"t4", at:"19:30", name:"30 minutos antes", link:true, text:`🚨 *Estamos quase começando!*

Daqui a 30 minutos eu abro a transmissão do nosso *Workshop WhatsApp que Vende*.

Clica no link abaixo e entra alguns minutinhos antes pra não perder o início. 👇

${PH}

Te espero lá!
_Erica Santiago_ 💜`},
 {id:"t5", at:"20:00", name:"Ao vivo", link:true, img:"ao-vivo.jpg", text:`🔴 *ESTAMOS AO VIVO!*

O nosso *Workshop WhatsApp que Vende* já começou.

Clica no link e entra agora 👇

${PH}

Bora transformar suas conversas em procedimentos vendidos todos os dias! 🚀


_Erica Santiago_`},
 {id:"t5b", at:"20:10", name:"Lembrete: ainda dá pra entrar", link:true, text:`*A aula já começou! Cadê você?*

Entre agora que está apenas começando:
👉 ${PH}`},
 {id:"t5c", at:"20:20", name:"Lembrete: sala cheia", link:true, text:`*A SALA ESTÁ CHEIA E SÓ FALTA VOCÊ!* 🔥

Ainda dá tempo de participar:
${PH}`},
 {id:"t6", at:null, label:"Na hora do pitch", name:"Aplicações abertas", text:`🔥 *ABRIMOS AS APLICAÇÕES!*

Como eu prometi ao vivo, essa é a oportunidade de entrar comigo no *Programa de Ativação*: um programa para profissionais da beleza que querem atrair mais clientes e vender todos os meses, sem depender de indicação, da sorte ou de viralizar no Instagram.

É onde você aplica tudo o que viu hoje, com o meu acompanhamento, em encontros semanais ao vivo.

⚠️ *São somente 10 vagas*, com uma condição exclusiva que eu liberei só pra quem estava no workshop. *Depois de hoje, ela não se repete.*

*Como funciona:*

1️⃣ Você preenche a aplicação (leva 2 minutos)
2️⃣ Minha equipe analisa o seu perfil
3️⃣ Se houver encaixe, entramos em contato pra te explicar tudo

Preencher a aplicação não te obriga a nada. É só o primeiro passo pra entender se o programa faz sentido pra você.

*Você já sabe fazer. Agora é hora de fazer vender.* 💚

👉 *Faça sua aplicação agora:*
https://ericasantiagopmu.com.br/programa-de-ativacao/

@all`},
 {id:"t7", at:null, label:"20 min após o pitch", name:"Link da aplicação", text:`👉 *Faça sua aplicação aqui:*
https://ericasantiagopmu.com.br/programa-de-ativacao/`}
];

const store = {
  get(k){try{return JSON.parse(localStorage.getItem("wqv20:"+k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem("wqv20:"+k,JSON.stringify(v))}catch(e){}}
};
let sent = store.get("sent") || {};
const meet = document.getElementById("meet");
meet.value = store.get("meet") || "";

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function finalText(m){ const l = meet.value.trim(); return l ? m.text.split(PH).join(l) : m.text; }
function render(m){
  let h = esc(finalText(m));
  h = h.replace(/\*([^*\n]+)\*/g,"<strong>$1</strong>").replace(/(^|[\s"(])_([^_\n]+)_/g,"$1<em>$2</em>");
  h = h.split(esc(PH)).join('<span class="ph">'+esc(PH)+'</span>');
  h = h.replace(/(https?:\/\/[^\s<]+)/g,'<span class="lk">$1</span>');
  return h;
}

function card(m, showTime){
  const el = document.createElement("div");
  el.className = "msg"; el.dataset.id = m.id;
  el.innerHTML = `
    <div class="time">${showTime ? (m.label || m.at.replace(":00","h").replace(":30","h30")) : ""}</div>
    <div class="card">
      <div class="top"><span class="name">${m.name}</span><span class="pill" data-pill></span></div>
      ${m.img ? `<figure class="art"><img src="${m.img}" alt="Arte Estou ao vivo do Workshop WhatsApp que Vende"><figcaption>Enviar a imagem junto, com o texto abaixo como legenda.</figcaption></figure>` : ""}
      <div class="bubble" data-bubble></div>
      <div class="actions">
        <button type="button" data-copy>Copiar mensagem</button>
        ${showTime ? `<label class="chk"><input type="checkbox" id="chk-${m.id}" data-chk> Enviada</label>` : ""}
        <span class="copied" data-ok hidden>Copiado ✓</span>
      </div>
    </div>`;
  el.querySelector("[data-copy]").addEventListener("click", () => copy(m, el));
  const chk = el.querySelector("[data-chk]");
  if (chk){ chk.checked = !!sent[m.id]; chk.addEventListener("change", () => { sent[m.id] = chk.checked; store.set("sent", sent); refresh(); }); }
  return el;
}

function copy(m, el){
  const t = finalText(m), ok = el.querySelector("[data-ok]");
  const done = () => { ok.hidden = false; setTimeout(() => ok.hidden = true, 1800); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(el.querySelector("[data-bubble]")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); ok.textContent = "Texto selecionado, use Ctrl+C"; done(); };
  try { navigator.clipboard.writeText(t).then(() => { ok.textContent = "Copiado ✓"; done(); }, fallback); } catch(e){ fallback(); }
}

const todayEl = document.getElementById("today");
today.forEach(m => todayEl.appendChild(card(m, true)));

function spNow(){
  const p = new Intl.DateTimeFormat("en-GB",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
  const g = t => +p.find(x => x.type === t).value;
  return {d:g("day"), mo:g("month"), secs:g("hour")*3600 + g("minute")*60 + g("second")};
}
const toSec = s => { const [h,m] = s.split(":").map(Number); return h*3600 + m*60; };
const pad = n => String(n).padStart(2,"0");

function refresh(){
  const now = spNow(), isDay = now.d === 20 && now.mo === 10;
  const linkMissing = !meet.value.trim();
  let nextSet = false, done = 0;
  today.forEach(m => {
    const el = todayEl.querySelector(`[data-id="${m.id}"]`), pill = el.querySelector("[data-pill]");
    el.querySelector("[data-bubble]").innerHTML = render(m);
    el.classList.remove("next","sent");
    if (sent[m.id]){ done++; el.classList.add("sent"); pill.textContent = "Enviada"; pill.className = "pill ok"; return; }
    if (m.link && linkMissing){ pill.textContent = "Falta o link"; pill.className = "pill warn"; }
    else { pill.textContent = "Agendada"; pill.className = "pill"; }
    if (!nextSet){ nextSet = true; el.classList.add("next");
      if (!(m.link && linkMissing)){ const late = isDay && m.at && now.secs >= toSec(m.at); pill.textContent = late ? "Enviar agora" : "Próxima"; pill.className = late ? "pill warn" : "pill"; } }
  });
  document.getElementById("progress").textContent = `${done} de ${today.length} enviadas`;
  const c = document.getElementById("count"), lbl = document.getElementById("countLbl"), num = document.getElementById("countNum");
  const left = toSec("20:00") - now.secs;
  if (isDay && left > 0){ c.classList.remove("live"); lbl.textContent = "Até a live (horário de Brasília)"; num.textContent = `${pad(Math.floor(left/3600))}:${pad(Math.floor(left%3600/60))}:${pad(left%60)}`; }
  else if (isDay){ c.classList.add("live"); lbl.textContent = "Status"; num.textContent = "AO VIVO"; }
  else { c.classList.remove("live"); lbl.textContent = "Live"; num.textContent = "20/10 · 20h"; }
}
meet.addEventListener("input", () => { store.set("meet", meet.value.trim()); refresh(); });
refresh(); setInterval(refresh, 1000);
</script>
</body>
</html>
